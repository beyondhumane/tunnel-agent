name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "src/TunnelAgent.Avalonia/Assets/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "src/TunnelAgent.Avalonia/Assets/**"
      - ".github/workflows/pages.yml"
  # A release made with GITHUB_TOKEN does not fire `release` events in other
  # workflows, so the site follows the Release workflow instead.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    env:
      SITE_URL: https://tunnel-agent.beyondhumane.com
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history gives every docs page its real last-modified date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Download links point at the latest published release. Without one,
      # the site falls back to the .csproj version.
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts \
            --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$latest" ]; then echo "TA_VERSION=$latest" >> "$GITHUB_ENV"; fi
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
